spring.application.name=shortly

# Server & Cloud Reverse Proxy
server.port=${PORT:${SERVER_PORT:8080}}
server.forward-headers-strategy=framework

# Default Database Configuration (H2 in-memory for instant out-of-the-box execution)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:shortly_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:sa}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
spring.jpa.database-platform=${SPRING_JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console (enabled for inspection)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT Configuration (override in production via JWT_SECRET env var)
jwt.secret=${JWT_SECRET:shortly-2-super-secret-jwt-key-minimum-256-bits-long-secure-and-robust}
jwt.expiration=${JWT_EXPIRATION:86400000}
