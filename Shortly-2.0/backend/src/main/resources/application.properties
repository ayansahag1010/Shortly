spring.application.name=shortly

# Server
server.port=8080

# Default Database Configuration (H2 in-memory for instant out-of-the-box execution)
spring.datasource.url=jdbc:h2:mem:shortly_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console (enabled for inspection)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT Configuration
jwt.secret=shortly-2-super-secret-jwt-key-minimum-256-bits-long-secure-and-robust
jwt.expiration=86400000
