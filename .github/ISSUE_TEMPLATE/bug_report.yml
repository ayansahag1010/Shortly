name: 🐛 Bug Report
description: Create a report to help us improve Shortly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!
  - type: dropdown
    id: edition
    attributes:
      label: Which edition is affected?
      options:
        - Shortly 1.0 (Client-side HTML/JS)
        - Shortly 2.0 (React 19 + Spring Boot 3)
        - Both
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How do we reproduce this issue?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
