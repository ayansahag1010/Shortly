name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend (Spring Boot 3 / Java 17)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Make mvnw executable
        run: chmod +x Shortly-2.0/backend/mvnw

      - name: Run Backend Tests
        run: |
          cd Shortly-2.0/backend
          ./mvnw clean test

  frontend-build:
    name: Frontend (React 19 / Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Shortly-2.0/frontend/shortly-react/package-lock.json

      - name: Install Dependencies
        run: |
          cd Shortly-2.0/frontend/shortly-react
          npm ci

      - name: Build Frontend
        run: |
          cd Shortly-2.0/frontend/shortly-react
          npm run build
